name: Deploy to Render

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        run: |
          # Render Dashboard -> Service Settings -> Deploy Hook хэсгээс авсан URL-аа энд тавина
          RENDER_HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          
          if [ -n "$RENDER_HOOK_URL" ]; then
            curl -X POST "$RENDER_HOOK_URL"
            echo "Render deployment triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deployment trigger."
          fi
